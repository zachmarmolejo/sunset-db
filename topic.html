<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Topic — Sunset DB</title>
  <link rel="stylesheet" href="assets/vendor/highlight/github.min.css" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <nav class="topnav">
    <a class="brand" href="index.html"><img class="brand-mark" src="assets/logo-mark.svg" alt="" width="28" height="28" /><span>Sunset DB</span></a>
    <div class="nav-links">
      <a href="index.html">Search</a>
      <a href="catalog.html">Catalog</a>
      <a href="add.html">Edit</a>
      <a href="delete.html">Delete</a>
    </div>
  </nav>
  <main id="root" class="detail-wrap">
    <p class="desc">Loading…</p>
  </main>
  <script src="assets/vendor/highlight/highlight.min.js"></script>
  <script src="assets/vendor/highlight/c.min.js"></script>
  <script src="assets/vendor/highlight/go.min.js"></script>
  <script src="assets/vendor/highlight/rust.min.js"></script>
  <script src="assets/vendor/highlight/python.min.js"></script>
  <script src="assets/app.js"></script>
  <script>
    (async () => {
      const { load, highlight, orderedSnippets } = SunsetDB;
      const root = document.getElementById("root");
      const id = new URLSearchParams(location.search).get("id");
      let all;
      try { all = await load(); } catch (e) {
        root.textContent = e.message; return;
      }
      const t = all.find(x => x.id === id);
      if (!t) {
        root.textContent = "Topic not found.";
        return;
      }
      document.title = t.title + " — Sunset DB";
      const append = (parent, tag, text, className) => {
        const el = document.createElement(tag);
        if (text !== undefined) el.textContent = text;
        if (className) el.className = className;
        parent.appendChild(el);
        return el;
      };
      root.replaceChildren();
      const back = append(root, "a", "← Catalog", "back");
      back.href = "catalog.html";
      append(root, "h1", t.title);
      append(root, "p", t.summary || "", "desc");
      const chips = append(root, "div", undefined, "chips");
      chips.style.marginBottom = "1rem";
      (t.languages || []).forEach(l => append(chips, "span", l, "chip lang"));
      if (t.os) append(chips, "span", t.os, "chip os");
      if (t.category) append(chips, "span", t.category, "chip");
      (t.tags || []).forEach(tag => append(chips, "span", tag, "chip"));
      if (t.when_to_use) {
        const panel = append(root, "div", undefined, "panel");
        append(panel, "h3", "When to use");
        append(panel, "p", t.when_to_use);
      }
      orderedSnippets(t).forEach(c => {
        const lang = (c.language || "c").toLowerCase();
        const block = append(root, "div", undefined, "code-block");
        const bar = append(block, "div", undefined, "bar");
        append(bar, "span", lang);
        append(bar, "span", "snippet");
        const code = append(append(block, "pre"), "code", c.code || "");
        code.className = `language-${lang}`;
        if (c.notes) append(block, "div", c.notes, "snip-notes");
      });
      if (t.pitfalls && t.pitfalls.length) {
        const panel = append(root, "div", undefined, "panel");
        append(panel, "h3", "Pitfalls");
        const list = append(panel, "ul");
        t.pitfalls.forEach(p => append(list, "li", p));
      }
      if (t.references && t.references.length) {
        const panel = append(root, "div", undefined, "panel refs");
        append(panel, "h3", "References");
        const list = append(panel, "ul");
        t.references.forEach(ref => {
          let url;
          try { url = new URL(ref); } catch { return; }
          if (!["http:", "https:"].includes(url.protocol)) return;
          const a = append(append(list, "li"), "a", ref);
          a.href = url.href;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
        });
      }
      highlight(root);
    })();
  </script>
</body>
</html>
